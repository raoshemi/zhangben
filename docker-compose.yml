name: zhangben

services:
  db:
    image: postgres:16-alpine
    container_name: zhangben-db
    environment:
      POSTGRES_DB: zhangben
      POSTGRES_USER: zhangben
      POSTGRES_PASSWORD: zhangben
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 只监听本机回环，避免数据库暴露到局域网；本机测试/运维仍可用 localhost:5433
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhangben -d zhangben"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: zhangben-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://zhangben:zhangben@db:5432/zhangben?schema=public
      # 开发默认值仅用于本地；生产必须用 .env 覆盖为随机长串
      JWT_SECRET: ${JWT_SECRET:-zhangben-dev-local-only-secret-please-change-32}
      PORT: 8080
      TZ: Asia/Shanghai
    ports:
      - "8081:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: zhangben-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  pgdata:
