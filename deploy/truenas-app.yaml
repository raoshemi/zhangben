# 周会计记账系统 —— TrueNAS SCALE「自定义应用」Compose 配置（全自动版）
#
# ┌─ 一次性安装 ──────────────────────────────────────────────────────────┐
# │ 1. Datasets 建目录（应用根目录 /mnt/main_pool/app_data/jizhang）：     │
# │      /mnt/main_pool/app_data/jizhang/pgdata    （数据库数据）          │
# │ 2. Apps → Discover Apps → Custom App → 粘贴本文件全部内容              │
# │ 3. 修改 4 处 CHANGE_ME（数据库密码/JWT_SECRET/管理员密码）             │
# │ 4. 安装完成。此后：GitHub 打 tag/推 master → Actions 自动构建 →        │
# │    watchtower 每 5 分钟检查并自动拉取新镜像、重启容器。无需任何手工操作 │
# └───────────────────────────────────────────────────────────────────────┘
#
# 说明：watchtower 只更新带 enable 标签的 3 个容器（backend/frontend），
#       数据库不会被自动重启，避免误伤。

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zhangben
      POSTGRES_PASSWORD: CHANGE_ME_DB_PASSWORD
      POSTGRES_DB: zhangben
      TZ: Asia/Shanghai
    volumes:
      - /mnt/main_pool/app_data/jizhang/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zhangben -d zhangben']
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: ghcr.io/raoshemi/zhangben/backend:latest
    restart: unless-stopped
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
    environment:
      DATABASE_URL: postgresql://zhangben:CHANGE_ME_DB_PASSWORD@db:5432/zhangben?schema=public
      # 必须 ≥32 字符；缺失或过弱后端会拒绝启动（安全要求）
      JWT_SECRET: CHANGE_ME_JWT_SECRET_32_PLUS_CHARS
      ADMIN_USERNAME: admin
      # 不填则自动生成一次性随机密码，只在容器日志出现一次
      ADMIN_PASSWORD: CHANGE_ME_ADMIN_PASSWORD
      TZ: Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/raoshemi/zhangben/frontend:latest
    restart: unless-stopped
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
    ports:
      - '3000:80'
    depends_on:
      - backend

  # 自动更新器：每 5 分钟检查镜像摘要，发现新版本自动拉取并重启上面的容器
  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # 检查间隔（秒），300 = 5 分钟
      WATCHTOWER_POLL_INTERVAL: 300
      # 只更新带 enable 标签的容器，绝不碰数据库和其他应用
      WATCHTOWER_LABEL_ENABLE: 'true'
      # 拉取后清理旧镜像，节省空间
      WATCHTOWER_CLEANUP: 'true'
      # 只在中文环境输出
      TZ: Asia/Shanghai
