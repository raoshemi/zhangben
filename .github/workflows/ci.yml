name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zhangben
          POSTGRES_USER: zhangben
          POSTGRES_PASSWORD: zhangben
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhangben -d zhangben"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: npm run build
      # e2e：在独立测试库上建 schema + 种子，再跑端到端测试
      - name: e2e 建库
        env:
          DATABASE_URL: postgresql://zhangben:zhangben@localhost:5432/zhangben_test?schema=public
        run: npx prisma migrate deploy
      - name: e2e 种子
        env:
          DATABASE_URL: postgresql://zhangben:zhangben@localhost:5432/zhangben_test?schema=public
        run: npm run seed
      - name: e2e 测试
        env:
          TEST_DATABASE_URL: postgresql://zhangben:zhangben@localhost:5432/zhangben_test?schema=public
        run: npm run test:e2e

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
