name: Deploy to TrueNAS

# 只在整个 CI（后端/前端/浏览器 e2e）全部通过后，才部署到 NAS
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, main]

concurrency:
  group: deploy-truenas
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: SSH 到 TrueNAS 执行 deploy.sh
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          port: ${{ secrets.NAS_SSH_PORT }}
          # 部署目录（NAS 上 git clone 的目录），配在仓库 Secret 里
          script_stop: true
          script: |
            cd "${{ secrets.NAS_APP_DIR }}"
            chmod +x ./deploy.sh
            ./deploy.sh
