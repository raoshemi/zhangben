name: Publish images

# 触发方式：
#   1. 推送到 master → 构建并推送 :latest（TrueNAS 的 watchtower 会自动拉取部署）
#   2. 打 tag（v1.0.0）→ 额外推送 :1.0.0 版本镜像，便于固定版本/回滚
on:
  push:
    branches: [master, main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 计算镜像版本
        id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push 后端运行时镜像
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ steps.meta.outputs.version }}

      - name: Build & push 前端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ steps.meta.outputs.version }}

      - name: Build & push 迁移镜像
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: migrate
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/migrate:latest
            ghcr.io/${{ github.repository }}/migrate:${{ steps.meta.outputs.version }}
